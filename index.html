<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>ouvir musica</title>
    
</head>
<body>
    <div class="container">
        <div class="navbar">
            <img src="img/logo.png" class="logo">
            <ul>
                <li><a href="#">HOME</a></li>
                <li><a href="#">SOBRE</a></li>
                <li><a href="#">ESPECIFICAÇÕES</a></li>
                <li><a href="#">PRODUTOS</a></li>
                <li><a href="#">CONECTE</a></li>
            </ul>
        </div>
        <div class="content">
            <div class="left-col">
                <h1>SEJA FELIZ  <br>COM <br> MUSICA</h1>
            </div>
            <div class="right-col">
                <p>Clique aqui para ouvir</p>
                <i class="bi bi-play-circle-fill" id="icon"></i>
            </div>
        </div>
    </div>  


    <audio id="mySong">

        <source src="Cookie - NewJeans (youtube).mp3" type="audio/mp3">

    </audio>
    

   <script>
    var mySong = document.getElementById("mySong");
    var icon = document.getElementById("icon");

    icon.onclick = function(){
        if(mySong.paused){
            mySong.play();
            
            // troca para pause
            icon.classList.remove("bi-play-circle-fill");
            icon.classList.add("bi-pause-circle-fill");
        } else {
            mySong.pause();
            
            // volta para play
            icon.classList.remove("bi-pause-circle-fill");
            icon.classList.add("bi-play-circle-fill");
        }
    }
</script>



</body>
</html>
